[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qxycell"
version = "0.1.0"
description = "QuPath exported single-cell measurements to annotated AnnData."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "QXYCell contributors" }
]
dependencies = [
  "anndata>=0.10",
  "cmcrameri>=1.0",
  "geopandas>=0.14",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "seaborn>=0.13",
  "shapely>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4"
]

[project.scripts]
qxycell = "qxycell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qxycell"]

[tool.ruff]
line-length = 100
target-version = "py310"

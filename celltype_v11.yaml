rules:

# ============================================================
# 1. T CELLS (ordered: specific → general)
# ============================================================

# Exhausted CD8 T cells co-expressing PD1 and LAG3
- name: "CD8+PD1+LAG3+"
  positive: ["CD8", "PD1", "LAG3"]

# Exhausted or activated CD8 T cells with PD1
- name: "CD8+PD1+"
  positive: ["CD8", "PD1"]
  negative: ["LAG3"]

# Exhausted or activated CD8 T cells with LAG3
- name: "CD8+LAG3+"
  positive: ["CD8", "LAG3"]
  negative: ["PD1"]

# Exhausted CD4 T cells with PD1 and LAG3
- name: "CD4_exh"
  positive: ["CD4", "PD1", "LAG3"]

# Regulatory T cells defined by FOXP3
- name: "CD4 Treg"
  positive: ["CD4", "FOXP3"]

# Activated CD4 T cells with PD1
- name: "CD4+PD1+"
  positive: ["CD4", "PD1"]
  negative: ["LAG3"]

# Activated CD4 T cells with LAG3
- name: "CD4+LAG3+"
  positive: ["CD4", "LAG3"]
  negative: ["PD1"]

# NK-like T cells co-expressing NK1 and CD3
- name: "NKT"
  positive: ["NK1", "CD3"]

# Pan-CD3 T cells lacking CD4 and CD8
- name: "CD3+ T"
  positive: ["CD3"]
  negative: ["CD4", "CD8"]

# Conventional CD4 T cells lacking MHCII and CD11c
- name: "CD4+ T"
  positive: ["CD4"]
  negative: ["MHCII", "CD11c"]

# Conventional CD8 T cells lacking MHCII and CD11c
- name: "CD8+ T"
  positive: ["CD8"]
  negative: ["MHCII", "CD11c"]


# ============================================================
# 2. NK / OTHER LYMPHOID
# ============================================================

# Cytotoxic NK cells marked by NK1 and GZMB
- name: "NK_cytotoxic"
  positive: ["NK1", "GZMB"]
  negative: ["CD3"]

# NK cells marked by NK1 and CD45, excluding CD3
- name: "NK"
  positive: ["NK1", "CD45"]
  negative: ["CD3"]


# ============================================================
# 3. APC (CLEANED)
# ============================================================

# --- B CELLS ---
# CD19+ B cells
- name: "B cell"
  positive: ["CD45", "CD19"]


# --- MONOCYTES (true circulating) ---
# Ly6C+ monocytes lacking F480 and MHCII
- name: "Monocyte"
  positive: ["CD45", "LY6C"]
  negative: ["F480", "MHCII"]


# --- MACROPHAGES (LY6C first) ---

# Recruited / inflammatory macrophages
# Ly6C+ inflammatory macrophages
- name: "Mac_LY6C"
  positive: ["CD45", "F480", "LY6C"]

# Differentiated APC-like macrophages (F480+ MHCII+ CD11c+, LY6C-)
- name: "Mac_MHCII_CD11c+"
  positive: ["CD45", "F480", "MHCII", "CD11c"]
  negative: ["LY6C"]

# Differentiated MHCII+ macrophages (CD11c-, LY6C-)
- name: "Mac_MHCII_CD11c-_LY6C-"
  positive: ["CD45", "F480", "MHCII"]
  negative: ["CD11c", "LY6C"]


# --- DENDRITIC CELLS ---
# MHCII+ CD8+ CD11c+ dendritic cells
- name: "DC_MHCII_CD8+"
  positive: ["CD45", "MHCII", "CD8", "CD11c"]
  negative: ["CD3"]

# MHCII+ CD11c+ dendritic cells lacking F480 and CD3
- name: "DC_CD11c"
  positive: ["CD45", "MHCII", "CD11c"]
  negative: ["F480", "CD3"]


# --- OTHER APC ---
# CD45+ MHCII+ APCs that are not CD4/CD8/B cells/F480+ or CD11c+
- name: "APC_other"
  positive: ["CD45", "MHCII"]
  negative: ["CD4", "CD8", "CD19", "F480", "CD11c"]


# ============================================================
# 4. NON-IMMUNE
# ============================================================

# CD31+ endothelial cells lacking CD45
- name: "Endothelial"
  positive: ["CD31"]
  negative: ["CD45"]

# HER2+ tumor cells lacking lymphocyte markers
- name: "Tumor"
  positive: ["HER2"]
  negative: ["CD45", "CD4", "CD8"]


# ============================================================
# 5. FALLBACK
# ============================================================

# Remaining CD45+ immune cells not captured by earlier rules
- name: "Other immune"
  positive: ["CD45"]

# Negative or unassigned cells
- name: "Negative"
  positive: []


# ============================================================
# MAPPINGS
# ============================================================

# Flat celltype -> major group mapping expected by the loader.
mappings:
  "CD8+PD1+LAG3+": "T cell"
  "CD8+PD1+": "T cell"
  "CD8+LAG3+": "T cell"
  "CD4_exh": "T cell"
  "CD4 Treg": "T cell"
  "CD4+PD1+": "T cell"
  "CD4+LAG3+": "T cell"
  "NKT": "Other"
  "CD3+ T": "T cell"
  "CD4+ T": "T cell"
  "CD8+ T": "T cell"

  "NK_cytotoxic": "Other"
  "NK": "Other"

  "B cell": "Other"
  "Monocyte": "APC"
  "Mac_LY6C": "APC"
  "Mac_MHCII_CD11c+": "APC"
  "Mac_MHCII_CD11c-_LY6C-": "APC"
  "DC_MHCII_CD8+": "APC"
  "DC_CD11c": "APC"
  "APC_other": "APC"

  "Endothelial": "Other"
  "Tumor": "Other"
  "Other immune": "Other"
  "Negative": "Other"

# Sub-group mapping keeps the same broad APC/Other buckets but splits T cells.
# CD3+ T cells are kept as their own pan-T subgroup instead of being forced
# into CD4 or CD8.
subgroup_mappings:
  "CD8+PD1+LAG3+": "CD8 T"
  "CD8+PD1+": "CD8 T"
  "CD8+LAG3+": "CD8 T"
  "CD8+ T": "CD8 T"

  "CD4_exh": "CD4 T"
  "CD4 Treg": "CD4 T"
  "CD4+PD1+": "CD4 T"
  "CD4+LAG3+": "CD4 T"
  "CD4+ T": "CD4 T"

  "CD3+ T": "CD3 T"

  "NKT": "Other"
  "NK_cytotoxic": "Other"
  "NK": "Other"

  "B cell": "Other"
  "Monocyte": "APC"
  "Mac_LY6C": "APC"
  "Mac_MHCII_CD11c+": "APC"
  "Mac_MHCII_CD11c-_LY6C-": "APC"
  "DC_MHCII_CD8+": "APC"
  "DC_CD11c": "APC"
  "APC_other": "APC"

  "Endothelial": "Other"
  "Tumor": "Other"
  "Other immune": "Other"
  "Negative": "Other"

name: qxycell
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  # Core scientific stack — installed via conda for reliable binaries
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.8
  - pillow>=12.3.0
  - seaborn>=0.13
  - scikit-learn>=1.3
  - geopandas>=0.14
  - shapely>=2.0
  - anndata>=0.10
  - pip:
      - pyyaml>=6.0
      - cmcrameri>=1.0
      - -e .
